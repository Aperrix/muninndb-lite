name: Release

on:
  push:
    tags:
      - 'v*-lite'

permissions:
  contents: write

jobs:
  # Run tests before building release binaries
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: >
          go test -timeout 300s
          ./cmd/muninn/...
          ./internal/auth/...
          ./internal/backup/...
          ./internal/bench/...
          ./internal/brief/...
          ./internal/cognitive/...
          ./internal/config/...
          ./internal/consolidation/...
          ./internal/engine/...
          ./internal/episodic/...
          ./internal/index/...
          ./internal/logging/...
          ./internal/mcp/...
          ./internal/metrics/...
          ./internal/plugin/...
          ./internal/provenance/...
          ./internal/query/...
          ./internal/scoring/...
          ./internal/storage/...
          ./internal/transport/mbp/...
          ./internal/types/...
          ./internal/wal/...
          ./internal/working/...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-14
            goos: darwin
            goarch: arm64
          - runner: macos-14
            goos: darwin
            goarch: amd64
          - runner: ubuntu-latest
            goos: windows
            goarch: amd64
            ext: .exe

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o muninndb-lite-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/muninn/

      - name: Smoke test
        if: matrix.goos == runner.os || (matrix.goos == 'linux' && runner.os == 'Linux') || (matrix.goos == 'darwin' && runner.os == 'macOS')
        run: |
          ./muninndb-lite-${{ matrix.goos }}-${{ matrix.goarch }} version
          ./muninndb-lite-${{ matrix.goos }}-${{ matrix.goarch }} help

      - name: Checksum
        run: |
          FILE="muninndb-lite-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          if command -v sha256sum &>/dev/null; then
            sha256sum "$FILE" > "muninndb-lite-${{ matrix.goos }}-${{ matrix.goarch }}.sha256"
          else
            shasum -a 256 "$FILE" > "muninndb-lite-${{ matrix.goos }}-${{ matrix.goarch }}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: muninndb-lite-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            muninndb-lite-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
            muninndb-lite-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "muninndb-lite ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            muninndb-lite-*
