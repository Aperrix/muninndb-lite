name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o muninndb-lite${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/muninn/

      - name: Vet
        run: go vet ./cmd/muninn/... ./internal/...

      - name: Test
        run: >
          go test -timeout 300s
          ./cmd/muninn/...
          ./internal/auth/...
          ./internal/backup/...
          ./internal/bench/...
          ./internal/brief/...
          ./internal/cognitive/...
          ./internal/config/...
          ./internal/consolidation/...
          ./internal/engine/...
          ./internal/episodic/...
          ./internal/index/...
          ./internal/logging/...
          ./internal/mcp/...
          ./internal/metrics/...
          ./internal/plugin/...
          ./internal/provenance/...
          ./internal/query/...
          ./internal/scoring/...
          ./internal/storage/...
          ./internal/transport/mbp/...
          ./internal/types/...
          ./internal/wal/...
          ./internal/working/...

      - name: Verify binary
        run: |
          ./muninndb-lite${{ matrix.os == 'windows-latest' && '.exe' || '' }} version
          ./muninndb-lite${{ matrix.os == 'windows-latest' && '.exe' || '' }} help

      - name: MCP smoke test
        if: matrix.os != 'windows-latest'
        run: |
          BINARY="./muninndb-lite"
          DATA_DIR="/tmp/muninndb-lite-ci-test-$$"
          REQUEST='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}'

          # Start MCP server in background, capture output
          echo "$REQUEST" | "$BINARY" mcp --data "$DATA_DIR" > /tmp/mcp-response.json 2>/dev/null &
          MCP_PID=$!

          # Wait for response (max 15s)
          for i in $(seq 1 15); do
            if [ -s /tmp/mcp-response.json ]; then
              break
            fi
            sleep 1
          done

          # Kill the process
          kill $MCP_PID 2>/dev/null || true
          wait $MCP_PID 2>/dev/null || true

          # Verify response
          cat /tmp/mcp-response.json
          grep -q '"serverInfo"' /tmp/mcp-response.json || { echo "MCP smoke test failed: no serverInfo in response"; exit 1; }
          rm -rf "$DATA_DIR" /tmp/mcp-response.json
