name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o muninndb-lite ./cmd/muninn/

      - name: Vet
        run: go vet ./cmd/muninn/... ./internal/...

      - name: Test
        run: go test -timeout 300s ./cmd/muninn/... ./internal/...

      - name: Verify binary
        run: |
          ./muninndb-lite version
          ./muninndb-lite help
