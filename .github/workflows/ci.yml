name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o muninndb-lite ./cmd/muninn/

      - name: Vet
        run: go vet ./cmd/muninn/... ./internal/...

      - name: Test
        run: >
          go test -timeout 300s
          ./cmd/muninn/...
          ./internal/auth/...
          ./internal/backup/...
          ./internal/bench/...
          ./internal/brief/...
          ./internal/cognitive/...
          ./internal/config/...
          ./internal/consolidation/...
          ./internal/engine/...
          ./internal/episodic/...
          ./internal/index/...
          ./internal/logging/...
          ./internal/mcp/...
          ./internal/metrics/...
          ./internal/plugin/...
          ./internal/provenance/...
          ./internal/query/...
          ./internal/scoring/...
          ./internal/storage/...
          ./internal/transport/mbp/...
          ./internal/types/...
          ./internal/wal/...
          ./internal/working/...

      - name: Verify binary
        run: |
          ./muninndb-lite version
          ./muninndb-lite help

      - name: MCP smoke test
        run: |
          DATA_DIR="/tmp/muninndb-lite-ci-test-$$"
          REQUEST='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}'

          echo "$REQUEST" | ./muninndb-lite mcp --data "$DATA_DIR" > /tmp/mcp-response.json 2>/dev/null &
          MCP_PID=$!

          for i in $(seq 1 15); do
            if [ -s /tmp/mcp-response.json ]; then break; fi
            sleep 1
          done

          kill $MCP_PID 2>/dev/null || true
          wait $MCP_PID 2>/dev/null || true

          cat /tmp/mcp-response.json
          grep -q '"serverInfo"' /tmp/mcp-response.json || { echo "MCP smoke test failed"; exit 1; }
          rm -rf "$DATA_DIR" /tmp/mcp-response.json

  # Windows: build-only (upstream tests have flaky failures on Windows)
  build-windows:
    name: Build (windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o muninndb-lite.exe ./cmd/muninn/

      - name: Verify binary
        run: |
          .\muninndb-lite.exe version
          .\muninndb-lite.exe help
